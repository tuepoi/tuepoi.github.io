<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10231f">
  <meta name="description" content="一个展示动态背景作品的小页面。">
  <title>动态背景小作品</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #eef5ee; background: radial-gradient(ellipse at 50% -20%, #315747 0, #172c27 48%, #101b1a 100%); }
    main { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0 48px; }
    header { margin-bottom: 30px; }
    .eyebrow { color: #a9d7b2; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1.08; }
    header p { color: #c1d1c8; margin: 0; font-size: 1.05rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 18px; }
    figure { margin: 0; padding: 14px; border: 1px solid #527064; border-radius: 18px; background: #1d322c; box-shadow: 0 18px 42px #07110f66; }
    img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 10px; background: #bee1f6; }
    figcaption { padding: 12px 4px 2px; color: #d4e2d9; }
    footer { margin-top: 24px; color: #a9bdb2; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">A small motion study</div>
      <h1>动态背景小作品</h1>
      <p>一段在路上奔跑的动画，以及它的 SVG 版本。</p>
    </header>
    <section class="gallery" aria-label="动画作品">
      <figure>
        <img src="walking_with_moving_background.gif" alt="在移动背景中奔跑的小人动画">
        <figcaption>GIF 动画</figcaption>
      </figure>
      <figure>
        <img src="walking_with_moving_background.svg" alt="在移动背景中奔跑的小人 SVG 动画">
        <figcaption>SVG 动画</figcaption>
      </figure>
    </section>
    <footer>由 GitHub Pages 发布</footer>
  </main>
</body>
</html>
